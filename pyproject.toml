[project]
name = "lightrag-mcp"
version = "0.1.0"
description = "MCP server for LightRAG knowledge graphs with local HuggingFace embeddings"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "lightrag-hku>=1.5.7,<2",
    "mcp>=1.9,<2",
    "sentence-transformers>=3,<6",
    "tiktoken>=0.8",
    "requests>=2.31",
]

[project.scripts]
lightrag-mcp = "lightrag_kg_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
